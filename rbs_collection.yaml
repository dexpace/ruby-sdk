# Third-party RBS, resolved from the gems the bundle actually holds. No third-party row exists
# yet: phase 7a's dexpace-serde-json declares json, but json's signatures are rbs's own stdlib set
# (`rbs collection install` already resolves `json` with `source: type: stdlib`) and json 3.0.2
# ships no sig/ of its own, so the codec's one `JSON::Coder` reference is settled in the Steepfile's
# :serde_json target instead of here; net-http and async-http arrive with the transports in phase 8,
# and each adds its own row here then. Core never gets one -- its allowlist is stdlib only, and
# stdlib signatures ship with rbs itself.
sources:
  - type: git
    name: ruby/gem_rbs_collection
    remote: https://github.com/ruby/gem_rbs_collection.git
    revision: main
    repo_dir: gems

path: .gem_rbs_collection

# The workspace's own gems are in the bundle by `path:` and each ships sig/, so the collection
# would load every signature a second time beside the Steepfile's explicit `signature` dirs and
# report each declaration as duplicated. Ignored here, so the Steepfile is the only source of
# a gem's own signatures and a target sees exactly the sig/ trees it names.
gems:
  - name: dexpace-core
    ignore: true
  - name: dexpace-transport-net_http
    ignore: true
  - name: dexpace-transport-async_http
    ignore: true
  - name: dexpace-serde-json
    ignore: true
  - name: dexpace-async-thread
    ignore: true
  - name: dexpace-conformance
    ignore: true
